<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unrest Tracker (half sheet)</title>
<!-- Paper backup for the activity: the same sheet for every reading level, since
     ratings and points don't depend on the level read. Two half sheets per
     letter page. Print standard (ams-planning CLAUDE.md): Atkinson Hyperlegible
     Next bundled, text students read >= 11pt, labels >= 9pt, furniture >= 8pt,
     write-in cells >= 0.3in, contrast >= 4.5:1. -->
<link rel="stylesheet" href="fonts/atkinson.css">
<style>
  :root{--ink:#1a1a1a;--muted:#4a4a4a;--rule:#8a8a8a}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f2ec;color:var(--ink);font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif}
  .sheet{background:#fff;width:8.5in;height:5.49in;margin:0 auto;padding:.28in .4in .2in;display:flex;flex-direction:column}
  .cut{width:8.5in;margin:0 auto;border-top:1px dashed #555;position:relative;height:0}
  .cut span{position:absolute;top:-.6em;left:50%;transform:translateX(-50%);background:#fff;padding:0 .5rem;font-size:8pt;color:var(--muted)}
  .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:.04in;margin-bottom:.05in;gap:.2in}
  .hd h1{font-size:14pt;font-weight:800;margin:0;line-height:1.15}
  .who{font-size:10pt;font-weight:600;white-space:nowrap}
  .who span{display:inline-block;border-bottom:1px solid #000;width:1.5in;margin:0 .1in 0 .05in}
  .who span.short{width:.45in}
  .lead{font-size:9pt;color:var(--muted);margin:0 0 .05in}
  table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11pt;line-height:1.15}
  col.ev{width:2.35in} col.lv{width:.95in} col.r{width:.75in} col.w{width:1.6in} col.g{width:.75in} col.c{width:.8in}
  thead th{text-align:left;font-size:9pt;font-weight:600;border-bottom:1.5px solid #000;padding:.02in .05in;vertical-align:bottom}
  tbody td{border-bottom:.75px solid var(--rule);padding:0 .05in;height:.36in;vertical-align:middle}
  tbody td.box{border-left:.75px solid var(--rule)}
  td .yr{font-size:9pt;color:var(--muted)}
  td.lv{font-size:10pt;letter-spacing:.14em;border-left:.75px solid var(--rule)}
  tfoot td{padding:.04in .05in;font-size:10pt;font-weight:700;height:.33in}
  tfoot td.box{border:1.5px solid #000}
  .foot{margin-top:auto;font-size:8pt;color:var(--muted);display:flex;justify-content:space-between}
  @media print{
    @page{size:letter portrait;margin:0}
    body{background:#fff}
    .sheet,.cut{margin:0}
  }
</style>
</head>
<body>
<template id="half">
  <div class="sheet">
    <div class="hd">
      <h1>Unrest in the Colonies · Tracker</h1>
      <div class="who">Name<span></span>Period<span class="short"></span>Group<span class="short"></span></div>
    </div>
    <p class="lead">As you read: circle your level, write your rating (1–8) and a few words for why. Day 5: write your group’s points (they must add up to 36), then the class average.</p>
    <table>
      <colgroup><col class="ev"><col class="lv"><col class="r"><col class="w"><col class="g"><col class="c"></colgroup>
      <thead><tr><th>Event</th><th>Level I read</th><th>My rating<br>(1–8)</th><th>Why, in a few words</th><th>Our group</th><th>Class average</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><td colspan="4" style="text-align:right">Our group’s points must add up to 36 »</td><td class="box"></td><td></td></tr></tfoot>
    </table>
    <div class="foot"><span>unrest.mrbsocialstudies.org</span><span>Keep this if your computer resets: it is your backup.</span></div>
  </div>
</template>
<script>
  var EVENTS = [['Proclamation of 1763',1763],['Quartering Act',1765],['Stamp Act',1765],['Townshend Acts',1767],
    ['Boston Massacre',1770],['Boston Tea Party',1773],['Intolerable Acts',1774],['First Continental Congress',1774],['Lexington & Concord',1775]];
  var tpl = document.getElementById('half');
  for (var c = 0; c < 2; c++) {
    var node = tpl.content.cloneNode(true);
    var tb = node.querySelector('tbody');
    EVENTS.forEach(function (e, i) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + (i + 1) + '. ' + e[0] + ' <span class="yr">' + e[1] + '</span></td>' +
        '<td class="lv">0 1 2 3</td><td class="box"></td><td class="box"></td><td class="box"></td><td class="box"></td>';
      tb.appendChild(tr);
    });
    document.body.appendChild(node);
    if (c === 0) {
      var cut = document.createElement('div');
      cut.className = 'cut'; cut.innerHTML = '<span>cut here</span>';
      document.body.appendChild(cut);
    }
  }
</script>
</body>
</html>
