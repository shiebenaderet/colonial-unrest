<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do WE Have Common Sense?</title>
<meta name="description" content="How each class answered the Do You Have Common Sense? quiz, next to what Thomas Paine would say.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Libre+Caslon+Text:ital@0;1&display=swap">
<link rel="stylesheet" href="fonts/atkinson.css?v=20261005">
<style>
/* Same Unit 2 look as common-sense-quiz.html. Built for a projector: big type, few words. */
:root{
  --bg:#f6f1e8; --panel:#fffdf9; --ink:#1f2124; --muted:#5a4f45; --rule:#d6cfc3;
  --deep:#7a2a28; --accent:#b23a34; --tint:#f6e7e4; --gold:#9a7536; --band:#f1e6d8; --on-accent:#fff;
  --ok:#2c6b37; --ok-tint:#e4f1e6; --no:#8a4b12; --no-tint:#f8ebdc;
  --mast:#3d1413; --mast-ink:#fff8ee; --mast-edge:#b88f86;
  --loyal:#1b2d45; --loyal-2:#5b6a85; --mid:#9a8f8a; --pat:#c9706a;
  --display:'Playfair Display',Georgia,serif;
  --body:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
  --orig:'Libre Caslon Text',Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1614; --panel:#241f1c; --ink:#f3ece3; --muted:#c9bcae; --rule:#40362f;
  --deep:#f0a59c; --accent:#e9827a; --tint:#3a2421; --gold:#d9b46a; --band:#2e2622; --on-accent:#1a0b09;
  --ok:#8fd19a; --ok-tint:#1f3424; --no:#f0b37a; --no-tint:#3a2a1a;
  --loyal:#9db8e0; --loyal-2:#7f93b5; --mid:#8a807c; --pat:#d9948e;
  --mast:#0f0b0a; --mast-edge:#7d6a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1614; --panel:#241f1c; --ink:#f3ece3; --muted:#c9bcae; --rule:#40362f;
  --deep:#f0a59c; --accent:#e9827a; --tint:#3a2421; --gold:#d9b46a; --band:#2e2622; --on-accent:#1a0b09;
  --ok:#8fd19a; --ok-tint:#1f3424; --no:#f0b37a; --no-tint:#3a2a1a;
  --loyal:#9db8e0; --loyal-2:#7f93b5; --mid:#8a807c; --pat:#d9948e;
  --mast:#0f0b0a; --mast-edge:#7d6a62; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
h1,h2,h3{font-family:var(--display);color:var(--deep);margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
a{color:var(--accent);font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.mast{position:sticky;top:0;z-index:20;background:var(--mast);color:var(--mast-ink);border-bottom:3px solid var(--gold)}
.mast .in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font-family:var(--display);font-weight:800;font-size:21px;color:var(--mast-ink);text-decoration:none}
.spacer{flex:1 1 auto}
.mbtn{min-height:40px;padding:6px 14px;border-radius:8px;font-size:15px;font-weight:700;background:transparent;color:var(--mast-ink);border:2px solid var(--mast-edge);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.mbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mbtn:hover{filter:brightness(1.1)}
.mbtn svg{width:18px;height:18px}
.stamp{font-size:14px;color:var(--mast-ink);opacity:.8}
main.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 64px;display:grid;gap:22px}
.head{display:grid;gap:4px}
.head h1{font-size:clamp(34px,5vw,56px)}
.head h1 .we{font-family:var(--body);font-weight:800;color:var(--accent);font-size:1.18em;letter-spacing:.02em;padding:0 .08em}
.head .sub{color:var(--muted);font-size:18px}

/* Period tabs */
.tabs{display:flex;flex-wrap:wrap;gap:10px}
.tab{min-height:56px;padding:8px 18px;border-radius:12px;border:2px solid var(--rule);background:var(--panel);font-weight:800;font-size:19px;cursor:pointer;display:grid;gap:0;place-items:center;line-height:1.1}
.tab small{font-size:14px;font-weight:700;color:var(--muted)}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);color:var(--deep)}
.tab[aria-pressed="true"] small{color:var(--deep)}

/* Class score card */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:22px 24px;display:grid;gap:16px}
.score{text-align:center;display:grid;gap:10px}
.score .lead{font-size:19px}
.score .pct{font-family:var(--display);font-size:clamp(56px,9vw,92px);font-weight:800;color:var(--deep);line-height:1;font-variant-numeric:lining-nums}
.score h2{font-size:clamp(26px,3.6vw,36px)}
.meter{position:relative;margin:30px 6px 8px}
.meter .track{height:18px;border-radius:999px;background:linear-gradient(90deg,var(--loyal),#8c7a8a 50%,var(--accent))}
.meter .pin{position:absolute;top:-26px;transform:translateX(-50%);display:grid;place-items:center}
.meter .pin b{background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:6px;font-size:14px;white-space:nowrap}
.meter .pin i{width:0;height:0;border:7px solid transparent;border-top-color:var(--ink)}
.meter .ends{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-top:6px}
.meter .ends span:first-child{color:var(--loyal)} .meter .ends span:last-child{color:var(--accent)}

/* Tier split */
.tiers{display:grid;gap:10px}
.tiers h3{font-size:20px;color:var(--ink)}
.tbar{display:flex;height:44px;border-radius:10px;overflow:hidden;background:var(--band)}
.tbar span{display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;min-width:0;transition:width .4s}
.tbar span:empty{font-size:0}
.tbar .t0{background:var(--loyal)} .tbar .t1{background:var(--loyal-2)} .tbar .t2{background:var(--mid)} .tbar .t3{background:var(--pat)} .tbar .t4{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:16px}
.legend span{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block}
.legend .t0 i{background:var(--loyal)} .legend .t1 i{background:var(--loyal-2)} .legend .t2 i{background:var(--mid)} .legend .t3 i{background:var(--pat)} .legend .t4 i{background:var(--accent)}
.legend b{font-variant-numeric:lining-nums}

/* Statements */
.stmts{display:grid;gap:12px}
.stmts h2{font-size:30px}
.stmts .how{color:var(--muted)}
.row{width:100%;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--rule);border-left:8px solid var(--rule);border-radius:12px;padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;align-items:center}
.row:hover{border-color:var(--accent)}
.row.same:hover{border-left-color:var(--ok)} .row.diff:hover{border-left-color:var(--no)}
.row.same{border-left-color:var(--ok)} .row.diff{border-left-color:var(--no)}
.row .st{font-weight:800;font-size:22px;grid-column:1;line-height:1.3}
.row .agree{grid-column:2;grid-row:1 / span 2;display:grid;gap:4px;min-width:170px;font-weight:800;font-size:17px;align-content:center}
.row .agree span{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.row .agree b{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:lining-nums;min-width:2.2em;text-align:right}
.row .agree .yes{color:var(--accent)} .row .agree .no{color:var(--loyal)}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--band)}
.row .bar{grid-column:1}
.bar span{display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;min-width:0;transition:width .4s}
.bar span:empty{font-size:0}
.bar .a1{background:var(--loyal)} .bar .a2{background:var(--loyal-2)} .bar .a3{background:var(--pat)} .bar .a4{background:var(--accent)}
.row .foot{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:16px;background:var(--band)}
.pill.big{font-size:20px;padding:8px 18px}
.verdict{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:10px;font-weight:800;font-size:17px;line-height:1.1}
.verdict .ic{font-size:20px;line-height:1}
.verdict.same{background:var(--ok-tint);color:var(--ok);border:2px solid var(--ok)}
.verdict.diff{background:var(--no-tint);color:var(--no);border:2px solid var(--no)}
.verdict.split{background:var(--band);color:var(--muted);border:2px solid var(--rule)}
.key{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.key i{width:14px;height:14px;border-radius:3px;display:inline-block}
.key .a1 i{background:var(--loyal)} .key .a2 i{background:var(--loyal-2)} .key .a3 i{background:var(--pat)} .key .a4 i{background:var(--accent)}

.empty{background:var(--tint);border-left:5px solid var(--accent);border-radius:10px;padding:16px 20px;font-size:19px}
.empty b{color:var(--deep)}
.err{background:var(--no-tint);border-left:5px solid var(--no);border-radius:10px;padding:14px 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* One statement on the screen */
.mbtn.dark{color:var(--ink);border-color:var(--rule);background:var(--panel);min-height:48px;font-size:17px}
#focus{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:18px 16px 40px}
body.focused{overflow:hidden}
.fwrap{max-width:1060px;margin:0 auto;display:grid;gap:18px;padding:22px 26px 26px;background:var(--panel);border:1px solid var(--rule);border-left:12px solid var(--rule);border-radius:18px}
.fwrap.same{border-left-color:var(--ok)} .fwrap.diff{border-left-color:var(--no)}
.ftop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fnum{color:var(--muted);font-weight:700;font-size:17px}
.fclose{min-width:48px;min-height:48px;border-radius:10px;border:2px solid var(--rule);background:var(--bg);font-size:22px;cursor:pointer}
.fst{font-size:clamp(30px,4.2vw,50px);color:var(--ink);line-height:1.18}
.fnums{display:flex;flex-wrap:wrap;gap:12px 40px}
.fnums span{display:flex;align-items:baseline;gap:12px}
.fnums b{font-family:var(--display);font-size:clamp(56px,8vw,88px);line-height:1;font-variant-numeric:lining-nums}
.fnums small{font-weight:800;font-size:22px}
.fnums .yes{color:var(--accent)} .fnums .no{color:var(--loyal)}
.fwrap .bar{height:52px;border-radius:12px} .fwrap .bar span{font-size:22px}
.fwrap .key{font-size:17px}
.fpaine{display:grid;gap:12px;padding:18px 20px;background:var(--band);border-radius:14px}
.fside{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.fpaine blockquote{margin:0;font-family:var(--orig);font-size:clamp(20px,2.6vw,28px);line-height:1.4;border-left:4px solid var(--gold);padding-left:16px}
.fpaine .why{font-size:19px}
.fnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hand{font-size:15px;color:var(--muted);font-weight:700;margin-top:4px}
.form{display:grid;gap:14px}
.form h3{font-size:20px;color:var(--ink);margin-top:6px}
.form p{color:var(--muted);font-size:16px}
.frow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.frow label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.form input[type=number]{width:72px;min-height:44px;font:inherit;font-size:18px;font-weight:800;text-align:center;border:2px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink)}
.form select{min-height:44px;font:inherit;font-size:17px;font-weight:700;border:2px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.srow span{font-size:16px}
.srow small{display:block;color:var(--muted);font-weight:700}
.form .msg{font-weight:700;color:var(--no);min-height:1.4em}
@media (max-width:700px){
  .row{grid-template-columns:1fr}
  .row .agree{grid-column:1;grid-row:auto;display:flex;flex-wrap:wrap;gap:4px 18px}
  .row .agree b{font-size:28px;min-width:0}
  .fwrap{padding:16px 16px 20px}
  .tbar{height:38px} .tbar span{font-size:15px}
}
@media (max-width:560px){.brand{font-size:18px}}
</style>
</head>
<body>
<header class="mast">
  <div class="in">
    <a class="brand" href="common-sense.html">Common Sense</a>
    <span class="spacer"></span>
    <span class="stamp" id="stamp" aria-live="polite"></span>
    <button class="mbtn" type="button" id="typein">Type In Results</button>
    <button class="mbtn primary" type="button" id="refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      <span>Refresh</span>
    </button>
  </div>
</header>
<main class="wrap">
  <div class="head">
    <h1>Do <span class="we">WE</span> Have Common Sense?</h1>
    <p class="sub">How we answered, next to what Thomas Paine would say. No names, only answers. Tap a statement to talk about it.</p>
  </div>
  <div class="tabs" id="tabs" role="group" aria-label="Which class"></div>
  <div id="out"></div>
</main>
<div id="focus" role="dialog" aria-modal="true" aria-labelledby="fst" hidden></div>

<script>
(function(){
'use strict';
/* The Responses tab of Mr. B's "Common Sense Quiz Results" sheet, shared
   read-only by link. The quiz page writes to it through the mailer script;
   this page only reads. Columns: Time, Period, Paine-o-meter %, Result,
   Same Side, Q1..Q10 (1 = Strongly Disagree .. 4 = Strongly Agree), Browser ID. */
const SHEET_ID = '1WmenyYzy7jm3XRZAzf0YyMytzXwILrxDCygq81dbZR0';
const CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=Responses';
const PERIODS = ['1', '2', '3', '5'];
const AUTO_MS = 20000;

/* Same statements, same order, same Paine side as common-sense-quiz.html. */
const QS = [
  { s: 'A person should get to be a leader because of who their parents are.', paine: false, id: 'ass-lion',
    quote: 'nature disapproves it, otherwise she would not so frequently turn it into ridicule by giving mankind an ass for a lion.',
    why: 'Paine said being born into a royal family proves nothing. A great king can have a child who would be a terrible ruler.' },
  { s: 'Government is something we need, but it is not really a good thing.', paine: true, id: 'society',
    quote: 'government even in its best state is but a necessary evil',
    why: 'Paine said people working together is good, but government only exists because people do wrong.' },
  { s: 'Rules should apply to everyone, even the person in charge.', paine: true, id: 'law-is-king',
    quote: 'in America the law is king.',
    why: 'Paine said that in a free country, the law rules everyone. No leader is above it.' },
  { s: 'A small country far away should be able to make the rules for a much bigger place.', paine: false, id: 'island',
    quote: 'there is something very absurd, in supposing a continent to be perpetually governed by an island.',
    why: 'Paine said it was silly for one small island, England, to rule a whole continent from across the ocean.' },
  { s: 'Ordinary people should get to choose who makes the laws.', paine: true, id: 'tree',
    quote: 'In this first parliament every man, by natural right, will have a seat.',
    why: 'Paine said government starts with people meeting together, then choosing representatives who share their interests.' },
  { s: 'If someone took care of you in the past, you should stay loyal to them no matter what.', paine: false, id: 'milk',
    quote: 'We may as well assert that because a child has thrived upon milk, that it is never to have meat',
    why: 'Paine said doing well under Britain in the past did not mean America needed Britain forever. America had grown up.' },
  { s: 'If you know you have to do something hard, it is better to do it now than to keep putting it off.', paine: true, id: 'putting-off',
    quote: 'like a man who continues putting off some unpleasant business from day to day, yet knows it must be done',
    why: 'Paine said America should declare independence now instead of dreading it.' },
  { s: 'After a big fight, it is usually best to make up and go back to the way things were.', paine: false, id: 'time-to-part',
    quote: "The blood of the slain, the weeping voice of nature cries, 'Tis time to part.",
    why: 'After people died at Lexington, Concord, and Bunker Hill, Paine said making up with Britain was no longer possible.' },
  { s: 'A group that sticks together is stronger than a group that is just big.', paine: true, id: 'unity',
    quote: 'It is not in numbers, but in unity, that our great strength lies',
    why: 'Paine said no colony could win alone, but together they could.' },
  { s: 'A fight for freedom in one country matters to people everywhere.', paine: true, id: 'cause',
    quote: 'The cause of America is in a great measure the cause of all mankind.',
    why: "Paine said America's fight was about rights that belong to every person on earth." }
];
const TIERS = [
  { min: 0, name: 'Loyalist' },
  { min: 25, name: 'Cautious Colonist' },
  { min: 45, name: 'On the Fence' },
  { min: 65, name: 'Patriot' },
  { min: 85, name: 'Pure Common Sense' }
];
const ANS = ['Strongly Disagree', 'Disagree', 'Agree', 'Strongly Agree'];

let rows = [];          // {period, a:[10 numbers], pct}
/* Hand counts typed in by Mr. B when the Chromebooks can't send (the district filter
   blocks script.google.com, Oct 20). Lives in this browser only. {period: {n, tiers[5], agree[10], at}} */
const MKEY = 'cs-results-manual';
let manual = {};
try { manual = JSON.parse(localStorage.getItem(MKEY) || '{}') || {}; } catch (e) { manual = {}; }
function saveManual(){ try { localStorage.setItem(MKEY, JSON.stringify(manual)); } catch (e) {} }
let view = '';
try { view = localStorage.getItem('cs-results-period') || ''; } catch (e) {}
if (view !== 'all' && PERIODS.indexOf(view) === -1) view = 'all';
try { var t = JSON.parse(localStorage.getItem('cs-annotated-v1') || '{}').theme; if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch (e) {}

const out = document.getElementById('out'), tabs = document.getElementById('tabs'), stamp = document.getElementById('stamp');
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  kids.flat().forEach(k => { if (k != null && k !== false) e.append(k); });
  return e;
}

/* A small CSV reader: quoted fields, doubled quotes, CRLF. */
function parseCSV(text){
  const res = [[]]; let f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { res[res.length - 1].push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; res[res.length - 1].push(f); f = ''; res.push([]); }
    else f += c;
  }
  res[res.length - 1].push(f);
  return res.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
}
function points(i, v){ return QS[i].paine ? v - 1 : 4 - v; }
function toRows(table){
  const head = table[0].map(h => h.trim().toLowerCase());
  const pi = head.indexOf('period'), qi = QS.map((q, i) => head.indexOf('q' + (i + 1)));
  if (pi < 0 || qi.some(x => x < 0)) throw new Error('The sheet does not have the columns this page expects.');
  const list = [];
  table.slice(1).forEach(r => {
    const period = String(parseInt(r[pi], 10));
    const a = qi.map(k => parseInt(r[k], 10));
    if (PERIODS.indexOf(period) === -1 || a.some(v => !(v >= 1 && v <= 4))) return;
    const total = a.reduce((s, v, i) => s + points(i, v), 0);
    list.push({ period, a, pct: Math.round(total / (QS.length * 3) * 100) });
  });
  return list;
}

async function load(manual){
  const btn = document.getElementById('refresh');
  btn.disabled = true;
  try {
    const r = await fetch(CSV_URL + '&t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('The sheet answered with an error (' + r.status + ').');
    rows = toRows(parseCSV(await r.text()));
    stamp.textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    render();
  } catch (e) {
    if (!rows.length || manual) {
      out.replaceChildren(el('div', { class: 'err' }, el('b', { text: 'Could not read the results sheet. ' }), String(e.message || e),
        el('p', { text: 'Check that the sheet is still shared as "Anyone with the link can view," then press Refresh.' })));
    }
    stamp.textContent = 'Could not update';
  }
  btn.disabled = false;
}

function tierOf(pct){ let t = TIERS[0]; TIERS.forEach(x => { if (pct >= x.min) t = x; }); return t; }

/* What a period contributes: sent results from the sheet, or Mr. B's hand count if he
   typed one (the hand count covers the whole class, so it replaces that period's rows). */
function periodData(p){
  const m = manual[p];
  if (m && m.pcts && m.pcts.length) {
    const n = Math.max(m.n || 0, m.pcts.length);
    const tiers = TIERS.map(() => 0);
    m.pcts.forEach(x => { tiers[TIERS.indexOf(tierOf(x))]++; });
    const hasStmt = (m.agree || []).some(v => v != null);
    const stmt = hasStmt ? QS.map((q, i) => { const a = m.agree[i] || 0; return { agree: a, dis: Math.max(0, n - a) }; }) : null;
    const sum = m.pcts.reduce((a, b) => a + b, 0) / m.pcts.length * n;
    return { n, tiers, stmt, sum, manual: true, at: m.at, pcts: true };
  }
  if (m && m.n > 0) {
    const hasStmt = m.agree.some(v => v != null);
    const stmt = hasStmt ? QS.map((q, i) => { const a = m.agree[i] || 0; return { agree: a, dis: Math.max(0, m.n - a) }; }) : null;
    let sum;
    if (hasStmt) sum = stmt.map((x, i) => (QS[i].paine ? x.agree : x.dis) / m.n).reduce((a, b) => a + b, 0) / QS.length * 100 * m.n;
    else { const mid = [12, 35, 55, 75, 92]; const tn = m.tiers.reduce((a, b) => a + b, 0) || 1; sum = m.tiers.reduce((a, c, k) => a + c * mid[k], 0) / tn * m.n; }
    return { n: m.n, tiers: m.tiers.slice(), stmt, sum, manual: true, at: m.at };
  }
  const set = rows.filter(r => r.period === p);
  const tiers = TIERS.map(() => 0);
  set.forEach(r => { tiers[TIERS.indexOf(tierOf(r.pct))]++; });
  const stmt = QS.map((q, i) => { const c = [0, 0, 0, 0]; set.forEach(r => { c[r.a[i] - 1]++; }); return { c, agree: c[2] + c[3], dis: c[0] + c[1] }; });
  return { n: set.length, tiers, stmt, sum: set.reduce((a, r) => a + r.pct, 0), manual: false };
}
function dataFor(v){
  const parts = (v === 'all' ? PERIODS : [v]).map(periodData).filter(d => d.n > 0);
  const n = parts.reduce((a, d) => a + d.n, 0);
  if (!n) return { n: 0 };
  const anyManual = parts.some(d => d.manual);
  const tiers = TIERS.map((t, k) => parts.reduce((a, d) => a + d.tiers[k], 0));
  const sp = parts.filter(d => d.stmt);          // parts that have statement counts
  const stmt = sp.length ? QS.map((q, i) => {
    const agree = sp.reduce((a, d) => a + d.stmt[i].agree, 0), dis = sp.reduce((a, d) => a + d.stmt[i].dis, 0);
    const c = anyManual ? [dis, agree] : [0, 1, 2, 3].map(k => sp.reduce((a, d) => a + d.stmt[i].c[k], 0));
    return { c, agree, dis };
  }) : null;
  return { n, tiers, stmt, stmtN: sp.reduce((a, d) => a + d.n, 0), avg: Math.round(parts.reduce((a, d) => a + d.sum, 0) / n), manual: anyManual,
           hand: parts.filter(d => d.manual).length, parts: parts.length, estimated: parts.some(d => d.manual && !d.stmt && !d.pcts) };
}
function current(){ return dataFor(view); }
function renderTabs(){
  tabs.replaceChildren();
  const opts = [['all', 'All Classes']].concat(PERIODS.map(p => [p, 'Period ' + p]));
  opts.forEach(([v, label]) => {
    const n = dataFor(v).n;
    tabs.append(el('button', { type: 'button', class: 'tab', 'aria-pressed': String(view === v),
      onclick: () => { view = v; try { localStorage.setItem('cs-results-period', v); } catch (e) {} render(); } },
      el('span', { text: label }), el('small', { text: n + (n === 1 ? ' student' : ' students') })));
  });
}

function render(){
  if (focused >= 0 && focused !== 99) { focus(focused); }
  renderTabs();
  const D = current();
  const label = view === 'all' ? 'All classes' : 'Period ' + view;
  out.replaceChildren();
  if (!D.n) {
    out.append(el('p', { class: 'empty' }, el('b', { text: label + ': ' }), 'no results yet. They show up here as students press Send, or type in a hand count with the button at the top. This page checks the sheet again every 20 seconds.'));
    return;
  }
  const n = D.n, avg = D.avg, counts = D.tiers;
  const tier = tierOf(avg);

  /* Score card */
  const card = el('section', { class: 'card', 'aria-label': 'Class Paine-o-meter' },
    el('div', { class: 'score' },
      el('p', { class: 'lead', text: (view === 'all' ? 'All of us together' : 'Period ' + view) + ': we agree with Thomas Paine' }),
      el('p', { class: 'pct', text: avg + '%' }),
      el('h2', { text: 'Our average: ' + tier.name }),
      D.manual ? el('p', { class: 'hand', text: (view === 'all' && D.hand < D.parts ? 'Mixed: some classes from a hand count, some from sent results.' : 'From a count typed in by Mr. B.') + (D.estimated ? ' The average is estimated from the tier counts.' : '') }) : null,
      el('div', { class: 'meter', role: 'img', 'aria-label': 'Paine-o-meter: class average ' + avg + ' percent, from Loyalist to Pure Common Sense' },
        el('div', { class: 'pin', style: 'left:' + avg + '%', 'aria-hidden': 'true' }, el('b', { text: label }), el('i')),
        el('div', { class: 'track' }),
        el('div', { class: 'ends', 'aria-hidden': 'true' }, el('span', { text: 'Loyalist' }), el('span', { text: 'Pure Common Sense' })))),
    el('div', { class: 'tiers' },
      el('h3', { text: 'Where the ' + n + ' of us landed' }),
      el('div', { class: 'tbar', role: 'img', 'aria-label': TIERS.map((t, i) => counts[i] + ' ' + t.name).join(', ') },
        TIERS.map((t, i) => el('span', { class: 't' + i, style: 'width:' + (counts[i] / Math.max(n, counts.reduce((a, b) => a + b, 0)) * 100) + '%', text: counts[i] ? String(counts[i]) : '' }))),
      el('div', { class: 'legend' }, TIERS.map((t, i) => el('span', { class: 't' + i }, el('i'), t.name + ' ', el('b', { text: String(counts[i]) }))))));
  out.append(card);

  /* Statements */
  if (!D.stmt) {
    out.append(el('section', { class: 'stmts' }, el('h2', { text: 'Statement by Statement' }),
      el('p', { class: 'empty', text: 'No statement counts for ' + label.toLowerCase() + ' yet. Type In Results takes a hands-up count for each statement.' })));
    return;
  }
  const sec = el('section', { class: 'stmts', 'aria-labelledby': 'st-h' },
    el('h2', { id: 'st-h', text: 'Statement by Statement' }),
    D.stmtN < D.n ? el('p', { class: 'how', text: 'Statement counts cover ' + D.stmtN + ' of the ' + D.n + ' students.' }) : null,
    el('p', { class: 'how', text: 'The numbers in the bar are how many of us picked each answer. Tap a statement to put it on the screen by itself.' }),
    key(D));
  QS.forEach((q, i) => {
    const st = stats(D, i);
    sec.append(el('button', { type: 'button', class: 'row ' + st.cls, 'aria-label': 'Statement ' + (i + 1) + ', open by itself', onclick: () => focus(i) },
      el('p', { class: 'st', text: (i + 1) + '. ' + q.s }),
      el('div', { class: 'agree' },
        el('span', { class: 'yes' }, el('b', { text: st.agreePct + '%' }), ' Agree'),
        el('span', { class: 'no' }, el('b', { text: (100 - st.agreePct) + '%' }), ' Disagree')),
      bar(st.c, n),
      el('div', { class: 'foot' },
        el('span', { class: 'pill', text: 'Paine says: ' + (q.paine ? 'Agree' : 'Disagree') }),
        verdict(st))));
  });
  out.append(sec);
}

function stats(D, i){
  const x = D.stmt[i], c = x.c, n = Math.max(1, x.agree + x.dis);
  const agreePct = Math.round(x.agree / n * 100);
  const split = agreePct === 50, same = !split && (agreePct > 50) === QS[i].paine;
  return { c, agreePct, split, same, cls: split ? 'split' : (same ? 'same' : 'diff') };
}
/* A four-shade bar for sent results; two segments (disagree, agree) for a hand count. */
function bar(c, n){
  const two = c.length === 2;
  const cls = two ? ['a2', 'a3'] : ['a1', 'a2', 'a3', 'a4'];
  const names = two ? ['Disagree', 'Agree'] : ANS;
  const total = Math.max(n, c.reduce((a, b) => a + b, 0));
  return el('div', { class: 'bar', role: 'img', 'aria-label': names.map((a, k) => c[k] + ' ' + a).join(', ') },
    c.map((v, k) => el('span', { class: cls[k], style: 'width:' + (v / total * 100) + '%', text: v ? String(v) : '' })));
}
function key(D){
  const two = D.manual;
  const items = two ? [['a2', 'Disagree'], ['a3', 'Agree']] : ANS.map((a, i) => ['a' + (i + 1), a]);
  return el('div', { class: 'key', 'aria-hidden': 'true' }, items.map(([k, a]) => el('span', { class: k }, el('i'), a)));
}
function verdict(st){
  return el('span', { class: 'verdict ' + st.cls },
    el('span', { class: 'ic', 'aria-hidden': 'true', text: st.split ? '=' : (st.same ? '✓' : '✗') }),
    el('span', { text: st.split ? 'We are split down the middle' : (st.same ? 'Most of us are with Paine' : 'Most of us disagree with Paine') }));
}

/* ---------- One statement at a time, for talking it through ---------- */
let focused = -1, lastRow = null;
const dlg = document.getElementById('focus');
function focus(i){
  if (i < 0) i = QS.length - 1; if (i >= QS.length) i = 0;
  const D = current();
  if (!D.n || !D.stmt) return;
  if (focused < 0) lastRow = document.activeElement;
  focused = i;
  const q = QS[i], n = D.n, st = stats(D, i);
  dlg.replaceChildren(
    el('div', { class: 'fwrap ' + st.cls },
      el('div', { class: 'ftop' },
        el('p', { class: 'fnum', text: 'Statement ' + (i + 1) + ' of ' + QS.length + ' · ' + (view === 'all' ? 'all of us' : 'Period ' + view) + ', ' + n + ' answers' }),
        el('button', { type: 'button', class: 'fclose', 'aria-label': 'Back to the list', onclick: unfocus, text: '✕' })),
      el('h2', { class: 'fst', id: 'fst', text: q.s }),
      el('div', { class: 'fnums' },
        el('span', { class: 'yes' }, el('b', { text: st.agreePct + '%' }), el('small', { text: 'of us agree' })),
        el('span', { class: 'no' }, el('b', { text: (100 - st.agreePct) + '%' }), el('small', { text: 'of us disagree' }))),
      bar(st.c, n),
      key(D),
      el('div', { class: 'fpaine' },
        el('div', { class: 'fside' }, el('span', { class: 'pill big', text: 'Paine says: ' + (q.paine ? 'Agree' : 'Disagree') }), verdict(st)),
        el('blockquote', {}, '“' + q.quote + '”'),
        el('p', { class: 'why', text: q.why }),
        el('a', { href: 'common-sense.html#' + q.id, target: '_blank', rel: 'noopener', text: 'Read this passage' })),
      el('div', { class: 'fnav' },
        el('button', { type: 'button', class: 'mbtn dark', onclick: () => focus(i - 1), text: '← Previous' }),
        el('button', { type: 'button', class: 'mbtn dark', onclick: unfocus, text: 'All 10' }),
        el('button', { type: 'button', class: 'mbtn dark', onclick: () => focus(i + 1), text: 'Next →' }))));
  dlg.hidden = false;
  document.body.classList.add('focused');
  dlg.querySelector('.fclose').focus();
}
function unfocus(){
  focused = -1; dlg.hidden = true; dlg.replaceChildren();
  document.body.classList.remove('focused');
  if (lastRow && lastRow.focus) lastRow.focus();
}
document.addEventListener('keydown', e => {
  if (focused < 0) return;
  if (e.key === 'Escape') unfocus();
  else if (focused === 99 || e.target.closest('input, select, textarea')) return;
  else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); focus(focused + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); focus(focused - 1); }
});

/* ---------- Type In Results: a hand count when Send is blocked ---------- */
function typeIn(){
  const p0 = view === 'all' ? PERIODS[0] : view;
  const cur = manual[p0] || {};
  const sel = el('select', { 'aria-label': 'Period' }, PERIODS.map(p => el('option', { value: p, text: 'Period ' + p, selected: p === p0 || null })));
  const num = (v, label) => el('input', { type: 'number', min: '0', max: '60', step: '1', inputmode: 'numeric', value: v == null ? '' : String(v), 'aria-label': label });
  const nIn = num(cur.n, 'How many students');
  const pctIn = el('textarea', { rows: '3', 'aria-label': 'Each student\'s percentage', placeholder: '70 45 82 55 …', style: 'width:100%;font:inherit;font-size:18px;font-weight:700;padding:8px 12px;border:2px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink)' });
  pctIn.value = cur.pcts ? cur.pcts.join(' ') : '';
  const tierIn = TIERS.map((t, k) => num(cur.tiers ? cur.tiers[k] : '', t.name));
  const agIn = QS.map((q, i) => num(cur.agree && cur.agree[i] != null ? cur.agree[i] : '', 'Agreed with statement ' + (i + 1)));
  const msg = el('p', { class: 'msg', role: 'status' });
  function fill(p){
    const m = manual[p] || {};
    nIn.value = m.n == null ? '' : m.n;
    pctIn.value = m.pcts ? m.pcts.join(' ') : '';
    tierIn.forEach((x, k) => { x.value = m.tiers ? m.tiers[k] : ''; });
    agIn.forEach((x, i) => { x.value = m.agree && m.agree[i] != null ? m.agree[i] : ''; });
  }
  sel.addEventListener('change', () => fill(sel.value));
  const v = x => { const k = parseInt(x.value, 10); return isNaN(k) ? 0 : Math.max(0, k); };
  const vn = x => x.value.trim() === '' ? null : v(x);     // blank stays blank
  function save(){
    const p = sel.value;
    const pcts = pctIn.value.split(/[^0-9.]+/).filter(x => x !== '').map(Number).filter(x => x >= 0 && x <= 100).map(Math.round);
    const n = v(nIn) || pcts.length;
    if (!n) { msg.textContent = 'Type how many students were in the room, or their percentages.'; nIn.focus(); return; }
    const agree = agIn.map(vn), tiers = tierIn.map(v);
    const over = agree.findIndex(a => a != null && a > n);
    if (over >= 0) { msg.textContent = 'Statement ' + (over + 1) + ' has more hands than students.'; agIn[over].focus(); return; }
    manual[p] = { n, tiers, agree, pcts: pcts.length ? pcts : null, at: new Date().toISOString() };
    saveManual(); view = p; try { localStorage.setItem('cs-results-period', p); } catch (e) {}
    unfocus(); render();
  }
  function clear(){
    delete manual[sel.value]; saveManual(); unfocus(); render();
  }
  dlg.replaceChildren(
    el('div', { class: 'fwrap' },
      el('div', { class: 'ftop' },
        el('p', { class: 'fnum', text: 'Hand count · for when the Chromebooks can\'t send' }),
        el('button', { type: 'button', class: 'fclose', 'aria-label': 'Close', onclick: unfocus, text: '✕' })),
      el('h2', { class: 'fst', text: 'Type In Results' }),
      el('div', { class: 'form' },
        el('p', { text: 'Students keep their result on their own screen. Ask the room, count hands, type the numbers. This replaces any sent results for that period on this page, and it is saved on this computer only.' }),
        el('div', { class: 'frow' }, el('label', {}, 'Period ', sel), el('label', {}, 'Students in the room ', nIn)),
        el('h3', { text: '1. Each student\'s percentage, if you wrote them down. Spaces or commas between them.' }),
        pctIn,
        el('h3', { text: 'Or, if you don\'t have the percentages: "Who got Loyalist?" and so on. Count hands for each.' }),
        el('div', { class: 'frow' }, TIERS.map((t, k) => el('label', {}, t.name + ' ', tierIn[k]))),
        el('h3', { text: '2. For each statement: "Hands up if you agreed (Agree or Strongly Agree)." Leave these blank if you only have the tier counts.' }),
        QS.map((q, i) => el('div', { class: 'srow' }, el('span', {}, el('small', { text: 'Statement ' + (i + 1) + ' · Paine says ' + (q.paine ? 'Agree' : 'Disagree') }), q.s), agIn[i])),
        msg,
        el('div', { class: 'fnav' },
          el('button', { type: 'button', class: 'mbtn dark', onclick: clear, text: 'Clear This Period\'s Hand Count' }),
          el('button', { type: 'button', class: 'mbtn primary', style: 'min-height:48px;font-size:17px', onclick: save, text: 'Save and Show' })))));
  focused = 99;   // so Escape closes it; arrow keys are ignored in the form
  dlg.hidden = false; document.body.classList.add('focused'); nIn.focus();
}
document.getElementById('typein').addEventListener('click', typeIn);
document.getElementById('refresh').addEventListener('click', () => load(true));
load(true);
setInterval(() => { if (!document.hidden) load(false); }, AUTO_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
})();
</script>
</body>
</html>
