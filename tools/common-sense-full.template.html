*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}

.spacer{flex:1 1 auto}
.mbtn{min-height:40px;padding:6px 14px;border-radius:8px;border:2px solid var(--mast-edge);background:transparent;color:var(--mast-ink);font:inherit;font-size:15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center}
.mast #rtools{position:relative;margin:0;flex-wrap:nowrap}

#rtools .rt-btn.rt-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#rtools .rt-panel{position:absolute;top:calc(100% + 8px);right:0;width:min(360px,90vw);z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.3);color:var(--ink)}
#rtools .rt-panel .rt-row{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;margin:0 0 14px}
#rtools .rt-panel .rt-opts{display:flex;flex-wrap:wrap;gap:8px}
main.wrap{max-width:900px;margin:0 auto;padding:24px 16px 64px}
h1,h2{font-family:var(--display);color:var(--deep);line-height:1.15;text-wrap:balance}
h1{font-size:clamp(36px,6vw,56px);margin:0 0 8px}
h2{font-size:clamp(24px,3.4vw,30px);margin:44px 0 14px;padding-top:14px;border-top:2px solid var(--rule)}
.intro{color:var(--muted);margin:0 0 18px}

nav.toc ol{margin:6px 0 0;padding-left:22px;display:grid;gap:4px}
.pamphlet{font-family:var(--orig);font-size:19px;line-height:1.8}
html[data-rt-font]:not([data-rt-font="atkinson"]) .pamphlet{font-family:var(--rt-font)}
.pamphlet p{margin:0 0 16px}
.pamphlet h2{font-family:var(--display)}
.hit{background:var(--tint);border-left:5px solid var(--accent);border-radius:8px;padding:10px 16px 2px;margin:0 0 16px}
.hit .back{display:inline-block;font-family:var(--body);font-size:15px;margin-bottom:6px}
.sig,.cite{text-align:right;margin-top:-6px}
.hit .sig{margin:-6px 0 10px}
p.fn{font-size:16px;line-height:1.55;border-left:3px solid var(--rule);padding-left:12px;color:var(--muted)}
table.costs{font-family:var(--body);font-size:16px;border-collapse:collapse;margin:0 0 20px;max-width:100%}
table.costs caption{text-align:left;font-weight:700;padding:0 0 6px}
table.costs th,table.costs td{border:1px solid var(--rule);padding:5px 12px;text-align:right}
table.costs th[scope=col]{background:var(--band)}
table.costs th[scope=row]{text-align:left;font-weight:600}
table.costs td.txt{text-align:left;max-width:16em}
table.costs tfoot td{font-weight:700}
.costs-wrap{overflow-x:auto}
.finis{text-align:center;font-style:italic}
@media (max-width:560px){.pamphlet{font-size:18px}.brand{font-size:18px}}
@media print{.mast,nav.toc{display:none}.hit{background:none}}
